---
layout: default
---
<div class="container-fluid p-0">
    <section class="resume-section">
        <div class="resume-section-content blog-content">
            <div class="back-link">
                <a href="{{ '/blog/' | relative_url }}">&larr; Back to Blog</a>
            </div>
            <h1 class="mb-0">{{ page.title }}</h1>
            <div class="blog-meta">
                <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %d, %Y" }}</time>
                {% if page.categories.size > 0 %}
                &middot; {% for cat in page.categories %}<span class="badge bg-primary">{{ cat }}</span> {% endfor %}
                {% endif %}
            </div>
            <div class="blog-body">
                {{ content }}
            </div>
        </div>
    </section>
</div>
