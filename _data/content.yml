research:
  publications:
    - title: "Hedging Performance of Multiscale Hedge Ratios"
      authors:
        - name: "Jahangir Sultan"
          url: "https://faculty.bentley.edu/details.asp?uname=jsultan"
        - name: "Antonios Alexandridis"
          url: "https://scholar.google.co.uk/citations?user=QA0daNQAAAAJ&hl=en"
        - name: "Mohammad Hasan"
          url: "https://www.kent.ac.uk/kent-business-school/people/senior-leadership-team/798/hasan-mohammad"
      year: "2019"
      journal: "Journal of Futures Markets"
      paperUrl: "https://onlinelibrary.wiley.com/doi/abs/10.1002/fut.22047"
      description: "In this study, we combine the wavelet multiscale model and neural network to improve the hedging performance of multiple classes of assets over traditional hedging models."

  workingPapers:
    - title: "Can Machines Understand Human Skills? Insights from Analyst Selection"
      authors:
        - name: "Sean Cao"
          url: "https://sites.google.com/view/seancao/home"
        - name: "Houping Xiao"
          url: "https://scholar.google.com/citations?user=JJnQE9sAAAAJ&hl=en&authuser=1"
        - name: "Baozhong Yang"
          url: "https://sites.google.com/view/baozhongyang/"
      paperUrl: "https://papers.ssrn.com/sol3/papers.cfm?abstract_id=4742174"
      status: "Revising for invited re-submission at Journal of Finance"
      description: "We use machine learning (ML) to provide a novel methodology to determine analysts' skills and effectively aggregate the forecasting opinions of analysts to form a crowd wisdom-based earnings forecast. Our machine-identified skilled analysts persistently outperform expert-picked star analysts. We find that machines rely on nonlinear interactions of analyst characteristics, such as past skill and efforts, to make predictions, unlike human experts, who lean more on relation-based information such as brokerage size."

    - title: "Decoding Mutual Fund Performance: Dynamic Return Patterns via Deep Learning"
      paperUrl: "assets/pdf/JMP_Machine_Learning_Mutual_Fund.pdf"
      status: "Forthcoming, Journal of Financial Stability"
      description: "I employ a state-of-the-art sequential deep learning model to understand and predict dynamic patterns in mutual fund returns. The model predicts sequences of future returns and offers interpretable insights. A long-short portfolio based on the model's prediction generates a 2.8% annualized Carhart 4-factor alpha, and this abnormal performance is persistent for up to four years. The model captures dynamic features of mutual fund strategies related to company fundamentals and macroeconomic states. Fund returns are most informative when they happen after earnings announcements for stocks held by the funds. Historical performance and macroeconomic variables are the most important determinants of future fund return patterns and performance."

    - title: "Mapping the Midweek Mountain: The New Geography of Hybrid Work"
      authors:
        - name: "Wei Jiang"
          url: "https://www.weijiang-finance.com/"
        - name: "Yaswanth Pothuru"
          url: "https://orcid.org/0009-0005-2180-5427"
        - name: "Baozhong Yang"
          url: "https://sites.google.com/view/baozhongyang/"
      paperUrl: "assets/pdf/Remote_Work_Paper.pdf"
      status: "Under submission"
      description: "This paper provides a behavioral analysis of the post-pandemic transformation of work, using a dataset of approximately 41 billion mobile geolocation records from 73.5 million individuals in the five largest U.S. metropolitan areas. By tracking movements between corporate headquarters, residences, and other points of interest, we document a structural shift in work patterns characterized by a new 'midweek mountain' of office attendance on Tuesdays through Thursdays. Our data reveals that workers now allocate significantly more time to non-work locations during the workday, indicating a lasting transformation in the integration of personal and professional life."

    - title: "The Impact of AI Adoption on Hedge Fund Performance"
      authors:
        - name: "Zhen Shi"
          url: "https://sites.google.com/site/zhenshihome/"
        - name: "Baozhong Yang"
          url: "https://sites.google.com/view/baozhongyang/"
      description: "We examine the impact of AI adoption on hedge fund performance and investment strategies. We find that AI adoption improves hedge fund performance by 2.64% annually. AI adoption also reduces fund risk and increases shape ratio and information ratio. The adoption of AI is associated with a greater number of holdings in the portfolio and less concentration in the local stocks."

    - title: "Why do actively managed mutual funds hold ETFs? Evidence on liquidity management"
      description: "I find that investment managers in actively managed mutual funds trade exchange-traded funds (ETFs) for liquidity management. The results show that funds that do not use index ETFs exhibit lower returns when they experience fund flow. The performance of funds that use index ETFs, however, is independent of investor's liquidity demands."

