cases:
  intro:
    heading: "Blockchain Business Cases"
    tagline: "From classroom to capstone — student-built blockchain ventures."
    description: "In my <b>Blockchain &amp; Cryptocurrency</b> course, students complete a capstone that takes a real business problem from boardroom to blockchain. Each team scopes a venture, drafts a full business plan, and ships a working <b>Solidity</b> smart-contract prototype on <b>Ethereum</b>. The result: technology fused with strategy — a showcase of how distributed ledgers can reshape industries from sports and entertainment to credit, intellectual property, and corporate governance."
    pillars:
      - icon: "fas fa-lightbulb"
        title: "Business Problem"
        text: "Identify a pain point that incentives, trust, or transparency in a centralized system fail to solve."
      - icon: "fas fa-briefcase"
        title: "Business Plan"
        text: "Map the value proposition, stakeholders, token economics, and go-to-market strategy."
      - icon: "fas fa-code"
        title: "Solidity Execution"
        text: "Deploy a working smart-contract prototype on Ethereum that proves the concept end-to-end."
  resources:
    title: "Foundational Blockchain Demos"
    introPresentation:
      title: "Introduction of Blockchain and Cryptocurrencies"
      url: "assets/pdf/Blockchain Introduction - AAII St Louis Chapter.pptx"
    demos:
      - title: "Hash Function"
        url: "https://andersbrownworth.com/blockchain/hash"
      - title: "Digital Signature"
        url: "https://andersbrownworth.com/blockchain/public-private-keys/keys"
      - title: "Mining (Proof of Work)"
        url: "https://stefanhuber.github.io/proof-of-work/"
      - title: "Bitcoin Demo"
        url: "https://coindemo.io/"
  cohorts:
    - year: 2026
      term: "Spring 2026"
      winners: ["fanpass", "collabproof", "whistleblower"]
      projects:
        - slug: "fanpass"
          name: "FanPass"
          tagline: "Loyalty-as-NFT for live entertainment."
          description: "A blockchain-based fan loyalty platform that issues programmable NFT passes, letting artists and venues reward attendance, gate exclusive content, and combat ticket scalping with verifiable on-chain history."
          videoEmbed: "https://www.youtube.com/embed/dZdxCWTymHE"
          report: "assets/cases/2026/fanpass/final-report.pdf"
          slides: "assets/cases/2026/fanpass/presentation.pdf"
        - slug: "collabproof"
          name: "CollabProof"
          tagline: "Tamper-proof attribution for creative collaboration."
          description: "A decentralized registry that timestamps and signs contributions across creative teams, so writers, designers, and engineers can prove authorship, split royalties automatically, and resolve IP disputes without a middleman."
          videoEmbed: "https://www.youtube.com/embed/L236c90Weak"
          report: "assets/cases/2026/collabproof/final-report.pdf"
          slides: "assets/cases/2026/collabproof/presentation.pdf"
        - slug: "whistleblower"
          name: "Whistleblower Reward System"
          tagline: "Anonymous integrity, on-chain incentives."
          description: "A zero-knowledge framework that lets whistleblowers submit verified evidence of corporate or public-sector misconduct anonymously, with smart-contract-escrowed bounties released once authorities confirm the report."
          videoEmbed: "https://www.youtube.com/embed/d8UBE6Ec2p0"
          report: "assets/cases/2026/whistleblower/final-report.pdf"
          slides: "assets/cases/2026/whistleblower/presentation.pdf"
        - slug: "authentichain"
          name: "AuthentiChain"
          tagline: "Provenance for luxury and high-value goods."
          description: "An on-chain certificate-of-authenticity protocol that pairs each physical product with an immutable digital twin, enabling buyers to verify origin, ownership history, and condition before purchase."
          videoEmbed: "https://www.youtube.com/embed/EvlFcLxb7Po"
          report: "assets/cases/2026/authentichain/final-report.docx"
          slides: "assets/cases/2026/authentichain/presentation.pptx"
        - slug: "creditchain"
          name: "CreditChain"
          tagline: "Portable credit identity for the underbanked."
          description: "A decentralized credit-scoring layer that aggregates on- and off-chain financial signals into a self-sovereign credit identity, giving thin-file borrowers a fair shot at lending markets worldwide."
          videoEmbed: "https://www.youtube.com/embed/DzJUx4XskiU"
          report: "assets/cases/2026/creditchain/final-report.pdf"
        - slug: "datavault"
          name: "DataVault"
          tagline: "User-owned data, monetized on your terms."
          description: "A consent-based data marketplace where individuals encrypt and license their personal data to researchers and advertisers, with smart contracts enforcing usage limits and streaming payments back to the data owner."
          videoEmbed: "https://www.youtube.com/embed/8vJcTLYZIWc"
          report: "assets/cases/2026/datavault/final-report.pdf"
          slides: "assets/cases/2026/datavault/presentation.pdf"
        - slug: "proofnet"
          name: "ProofNet"
          tagline: "Verifiable credentials for a remote-first workforce."
          description: "A decentralized credentialing network that lets employers, universities, and certifying bodies issue tamper-evident proofs of skills, employment, and education that candidates can selectively share with recruiters."
          videoEmbed: "https://www.youtube.com/embed/0SJR7Eito88"
          report: "assets/cases/2026/proofnet/final-report.pdf"
          slides: "assets/cases/2026/proofnet/presentation.pptx"
    - year: 2025
      term: "Spring 2025"
      winners: ["autoledger"]
      projects:
        - slug: "autoledger"
          name: "AutoLedger"
          tagline: "A trusted vehicle history, end-to-end on-chain."
          description: "AutoLedger replaces fragmented vehicle-history reports with a single immutable record: every sale, service, accident, and odometer reading is signed by the responsible party and written to Ethereum, so used-car buyers and lenders can finally trust what they see."
          videoEmbed: "https://www.youtube.com/embed/OoK6DH0g0zM"
          report: "assets/cases/2025/autoledger/final-report.pdf"
          slides: "assets/cases/2025/autoledger/presentation.pptx"
        - slug: "bagblock"
          name: "BagBlock"
          tagline: "Lost-luggage insurance that pays itself."
          description: "BagBlock turns airline baggage tags into smart contracts: passengers stake a small premium, airline scans feed real-time custody data on-chain, and if a bag goes missing the policy auto-pays the traveler without a single claim form."
          videoEmbed: "https://www.youtube.com/embed/SJYG_0IieNY"
          report: "assets/cases/2025/bagblock/final-report.pdf"
          slides: "assets/cases/2025/bagblock/presentation.pptx"
        - slug: "fanpass"
          name: "FanPass"
          tagline: "Memberships that travel with the fan, not the venue."
          description: "The 2025 prototype of FanPass — a portable fan-loyalty NFT that survives across teams, seasons, and resale markets, giving sports franchises a richer view of their most engaged supporters and giving fans real ownership of their fandom."
          videoEmbed: "https://www.youtube.com/embed/NVWABs1SKVo"
          report: "assets/cases/2025/fanpass/final-report.pdf"
          slides: "assets/cases/2025/fanpass/presentation.pptx"
        - slug: "fundforge"
          name: "FundForge"
          tagline: "Decentralized venture funding for student innovators."
          description: "A token-curated crowdfunding platform built for university entrepreneurs: backers stake capital in milestone-gated smart contracts, founders unlock funds only as deliverables ship, and reputation accrues on-chain across multiple raises."
          videoEmbed: "https://www.youtube.com/embed/rLgzAz1y7h0"
          report: "assets/cases/2025/fundforge/final-report.pdf"
          slides: "assets/cases/2025/fundforge/presentation.pptx"
        - slug: "ideafirst"
          name: "IdeaFirst"
          tagline: "Stake an idea before someone else does."
          description: "IdeaFirst lets innovators register a hash of an early-stage idea on Ethereum to establish priority, then progressively reveal details to vetted collaborators or investors — a Web3 answer to provisional patents for the open-innovation era."
          videoEmbed: "https://www.youtube.com/embed/i4S3HuzMJnc"
          report: "assets/cases/2025/ideafirst/final-report.pptx"
          slides: "assets/cases/2025/ideafirst/presentation.docx"
        - slug: "splitchain"
          name: "SplitChain"
          tagline: "Group expenses, settled trustlessly."
