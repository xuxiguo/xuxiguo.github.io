research:
  publications:
    - title: "Hedging Performance of Multiscale Hedge Ratios"
      authors:
        - name: "Jahangir Sultan"
          url: "https://faculty.bentley.edu/details.asp?uname=jsultan"
        - name: "Antonios Alexandridis"
          url: "https://scholar.google.co.uk/citations?user=QA0daNQAAAAJ&hl=en"
        - name: "Mohammad Hasan"
          url: "https://www.kent.ac.uk/kent-business-school/people/senior-leadership-team/798/hasan-mohammad"
      year: "2019"
      journal: "Journal of Futures Markets"
      paperUrl: "https://onlinelibrary.wiley.com/doi/abs/10.1002/fut.22047"
      description: "In this study, we combine the wavelet multiscale model and neural network to improve the hedging performance of multiple classes of assets over traditional hedging models."

    - title: "Decoding Mutual Fund Performance: Dynamic Return Patterns via Deep Learning"
      year: "2026"
      journal: "Journal of Financial Stability"
      paperUrl: "https://www.sciencedirect.com/science/article/pii/S1572308926000343"
      description: "This paper uses a sequential deep learning model to uncover and predict dynamic patterns in mutual fund returns. A long-short portfolio based on the model generates a 2.8% annualized four-factor alpha that persists for up to four years."

  workingPapers:
    - title: "Can Machines Understand Human Skills? Insights from Analyst Selection"
      authors:
        - name: "Sean Cao"
          url: "https://sites.google.com/view/seancao/home"
        - name: "Houping Xiao"
          url: "https://scholar.google.com/citations?user=JJnQE9sAAAAJ&hl=en&authuser=1"
        - name: "Baozhong Yang"
          url: "https://sites.google.com/view/baozhongyang/"
      paperUrl: "https://papers.ssrn.com/sol3/papers.cfm?abstract_id=4742174"
      status: "Revising for invited re-submission at Journal of Finance"
      description: "We use machine learning to identify skilled financial analysts and aggregate their forecasts into a crowd wisdom-based earnings prediction. Machine-selected analysts persistently outperform expert-picked star analysts by leveraging nonlinear interactions of analyst characteristics rather than relation-based information."

    - title: "Mapping the Midweek Mountain: The New Geography of Hybrid Work"
      authors:
        - name: "Wei Jiang"
          url: "https://www.weijiang-finance.com/"
        - name: "Yaswanth Pothuru"
          url: "https://orcid.org/0009-0005-2180-5427"
        - name: "Baozhong Yang"
          url: "https://sites.google.com/view/baozhongyang/"
      paperUrl: "assets/pdf/Remote_Work_Paper.pdf"
      status: "Under submission"
      description: "Using 41 billion mobile geolocation records, we document a lasting post-pandemic shift in work patterns: a 'midweek mountain' of office attendance on Tuesdays through Thursdays, with workers spending significantly more time at non-work locations during the workday."

    - title: "The Impact of AI Adoption on Hedge Fund Performance"
      authors:
        - name: "Zhen Shi"
          url: "https://sites.google.com/site/zhenshihome/"
        - name: "Baozhong Yang"
          url: "https://sites.google.com/view/baozhongyang/"
      description: "We examine how AI adoption affects hedge fund performance and find that it improves returns by 2.64% annually, reduces risk, and leads to more diversified portfolios with less concentration in local stocks."

    - title: "The Vulnerability Trap: How Sudden Stops Erode Firm Financial Health Through Supply Chain Destruction"
      authors:
        - name: "Anqi Jiao"
          url: "https://sites.google.com/site/anqijiao/home"
      description: "We show that sudden stops in international capital flows destroy firms' supply chain networks, creating a vulnerability trap: financially fragile firms suffer the most network damage, which further weakens their financial health and amplifies exposure to future crises."

    - title: "Why do actively managed mutual funds hold ETFs? Evidence on liquidity management"
      description: "This paper examines why actively managed mutual funds hold ETFs and finds they serve as a liquidity management tool. Funds using index ETFs maintain performance regardless of investor flow, while non-users suffer lower returns during redemptions."

